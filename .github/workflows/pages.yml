# Publishes the free web version to GitHub Pages on every push to main:
#   https://<your-name>.github.io/hungry-snaily-math/
# One-time setup: Settings > Pages > Source: "GitHub Actions" (public repo).
name: Web version (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm test
      - name: Assemble site
        run: |
          rm -rf dist && cp -r www dist
          cp site/privacy.html dist/privacy.html
          cp site/index.html dist/support.html
          sed -i "s/CACHE_VERSION/${GITHUB_SHA::12}/" dist/sw.js
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
